/* ===== Game-UI theme: sky blue, teal panels, chunky orange buttons ===== */

.fitbox{--u:8px;position:relative;flex:1;min-height:0;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:calc(var(--u)*.5);overflow:visible}
.fitbox .card{--fs:var(--u)}
.fitbox.fan{flex-wrap:nowrap;gap:0}.fitbox.fan .card+.card{margin-left:calc(var(--u)*-6.4)}
.fitbox .set{flex:none;margin:0;padding:calc(var(--u)*.35)}
.fitbox .set>small{margin-bottom:calc(var(--u)*.2)}
.fitbox .set .row{flex-wrap:nowrap;gap:calc(var(--u)*.3)}
.fitbox>small,.fitbox .set>small{font-family:system-ui,sans-serif;font-weight:600}
.fitbox .card:hover{transform:scale(clamp(1.35,calc(22 / var(--n)),4.5))!important;z-index:30;box-shadow:0 .6em 2em #000b;transform-origin:50% 50%!important}
.opp .fitbox .card:hover{transform-origin:50% 0!important}
.fitbox.hand .card:hover{transform-origin:50% 100%!important}
body.dragging .fitbox .card:hover{transform:none!important;box-shadow:none}
.over{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;background:var(--tl);color:var(--ink);border-bottom:8px solid var(--tld);border-radius:16px;padding:22px 40px 26px;text-align:center;box-shadow:0 20px 60px #000a}
.over h2{margin:0 0 12px;font:400 40px 'Lilita One',ui-rounded,system-ui,sans-serif}

.hb{grid-template-columns:minmax(0,44%) minmax(0,1fr)}
.fitbox.fan .card+.card{margin-left:calc(var(--u)*-5.8)}
.fitbox.hand{justify-content:center;align-content:center}
.fitbox .set>small{font-size:max(8px,calc(var(--u)*1.3))}
.fitbox>small{font-size:12px;opacity:.6}

.bg-night{background-color:#0b1020;background-image:radial-gradient(ellipse at 50% 30%,#2b3a8a66,transparent 65%),radial-gradient(ellipse at 80% 90%,#7c3aed33,transparent 55%),radial-gradient(#ffffff14 1.2px,transparent 1.6px);background-size:auto,auto,calc(36px*var(--s)) calc(36px*var(--s))}
body.bgv{background-attachment:fixed;background-position:center}
#screen{background:transparent!important}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;letter-spacing:0;color:var(--ink)}
button{font-family:inherit;font-weight:600;font-size:14px;text-transform:none;letter-spacing:.01em;color:#04222a;text-shadow:none;background:var(--btn);border:0;border-radius:999px;padding:9px 20px;margin:2px;box-shadow:0 4px 14px #0004,inset 0 1px 0 #fff6;transition:transform .12s,filter .15s,box-shadow .15s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:translateY(1px);box-shadow:0 1px 4px #0005}
button.ghost,#pickbar .ghost{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gb)}
#bar{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--gb);padding:0 16px}
#bar b{font-size:17px;font-weight:700;letter-spacing:.04em;color:#fff;text-shadow:none}
#bar label{color:var(--mut)}#bar input{accent-color:var(--acc)}
.opp,.me,.mid{background:var(--glass);color:var(--ink);border:1px solid var(--gb);border-radius:16px;box-shadow:0 10px 30px #0004;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.on-turn{box-shadow:0 0 0 2px var(--acc),0 0 28px #6ee7b799}
.nm{font-weight:700;font-size:15px}
.av{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--gb)}
.chip{background:var(--glass2);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--gb);border-radius:999px;font-size:12px;font-weight:600}
.pips i{border-color:var(--acc)}.pips i.f{background:var(--acc)}
.lbl{color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.set{background:var(--glass2);border-radius:10px}.set>small{color:var(--mut)}
.st{font-weight:700;font-size:18px}.st small{color:var(--mut);font-size:12px}
.piles span{color:var(--mut)}
#log{background:var(--glass);color:var(--ink);border:1px solid var(--gb);border-radius:10px;font-weight:500}
.hint{background:var(--glass);color:var(--acc);border:1px solid var(--gb);border-radius:999px;font-weight:600}.hint a{color:var(--acc2)}
.zone.zok{border-color:var(--acc);background:rgba(110,231,183,.22)}
.zp{border-color:var(--gb);color:var(--mut)}.zp.zok{color:var(--ink)}
.zone.zhot{background:rgba(110,231,183,.45)!important}.set.zhot{background:rgba(110,231,183,.6)!important}
.chips{color:var(--ink)}
#modal{background:#050a14b3;backdrop-filter:blur(6px)}
.box{background:rgba(16,24,38,.92);color:var(--ink);border:1px solid var(--gb);border-radius:20px;box-shadow:0 20px 60px #0008;font-family:inherit;font-weight:500}
.box h3{font-family:inherit;font-weight:700;font-size:20px;color:#fff}
.box button{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gb);border-radius:12px;text-align:center;padding:10px 14px;font-size:14px}
.box button:hover{background:var(--btn);color:#04222a;filter:none}
#pickbar{background:rgba(16,24,38,.92);color:var(--ink);border:1px solid var(--gb);border-radius:999px;backdrop-filter:blur(10px);font-family:inherit}
#pickbar b{font-family:inherit;font-weight:700;font-size:15px}
.ttl{filter:none;margin:0 auto}
.ttl span{-webkit-text-stroke:0;paint-order:normal;font-weight:800;letter-spacing:.12em}
.ttl .t1{font-size:clamp(38px,9vw,78px);background:linear-gradient(180deg,#fff,#cfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #0007)}
.ttl .t2{font-size:clamp(22px,4.5vw,38px);letter-spacing:.7em;margin:4px 0 0 .7em;background:linear-gradient(90deg,#6ee7b7,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.pnl{margin:34px auto 0;max-width:460px;background:var(--glass);border:1px solid var(--gb);border-bottom:1px solid var(--gb);border-radius:24px;padding:26px 26px 22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 24px 70px #0006}
.pill{position:static;transform:none;min-width:0;background:none;border:0;padding:0 0 14px;font-size:12px;letter-spacing:.28em;color:var(--mut);font-weight:700;text-shadow:none;text-align:center}
.mb2{font-size:17px;padding:14px 10px;margin:9px 0;border-radius:14px}
.bkb,.bk{font-size:14px;position:absolute;left:16px;top:16px;z-index:5}
.msg{color:var(--mut);font-family:inherit;font-weight:500}
.rh .pill{font-size:15px;padding:0;flex:1;color:#fff}
.rb{background:var(--glass);border:1px solid var(--gb);border-bottom:1px solid var(--gb);border-radius:20px;color:var(--ink);font:500 15px/1.6 Inter,system-ui,sans-serif;backdrop-filter:blur(14px)}

.rb b{color:var(--acc)}.rb table{background:var(--glass2)}.rb th{background:var(--glass2)}.rb th,.rb td{border-bottom:1px solid var(--gb)}

.bx::before{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px #0006}
.opt input:checked+.bx{background:linear-gradient(135deg,#34d399,#0ea5e9);border:0}
.opt input:checked+.bx::before{transform:translateX(18px)}

.bgp::after{content:'';position:absolute;left:12%;right:12%;top:20%;height:60%;border-radius:10px;background:var(--glass);border:1px solid var(--gb);backdrop-filter:blur(3px)}
.bgp i{position:absolute;z-index:1;bottom:26%;left:50%;width:22px;height:30px;border-radius:4px;background:#fff;box-shadow:-30px 3px 0 #fffc,30px 3px 0 #fffc,0 3px 6px #0005;transform:translateX(-50%) rotate(-3deg)}

.fitbox::-webkit-scrollbar{display:none}
body.bg-grey{--glass:rgba(12,18,30,.74)}body.bg-orange{--glass:rgba(30,10,4,.55)}
</style></head><body class="bgv bg-green">
<div id="bar"><b>🎩 Monopoly Deal</b><label>Opponent speed 🐢 <input type="range" id="spd" min="1" max="10" value="6"> 🐇</label><button onclick="leave()">Menu</button></div><div id="app"></div><div id="modal"><div class="box"></div></div><div id="pickbar"></div><div id="screen"></div>
<script>
/* Monopoly Deal - single file. Human = player 0, others are rule-based bots.
   Simplifications: one House/Hotel per color; a set of only rainbow wilds is not complete;
   Houses/Hotels used as payment go to the receiver's bank; bots never play Forced Deal. */
const $=s=>document.querySelector(s),sleep=async ms=>{const g=gid;await new Promise(r=>setTimeout(r,ms));if(g!==gid)throw 'stale'};
var gid=0;
const CP={brown:2,lblue:3,pink:3,orange:3,red:3,yellow:3,green:3,dblue:2,rr:4,util:2};
const RENT={brown:[1,2],lblue:[1,2,3],pink:[1,2,4],orange:[1,3,5],red:[2,3,6],yellow:[2,4,6],green:[2,4,7],dblue:[3,8],rr:[1,2,3,4],util:[1,2]};
const NAME={brown:'Brown',lblue:'Lt Blue',pink:'Pink',orange:'Orange',red:'Red',yellow:'Yellow',green:'Green',dblue:'Dk Blue',rr:'Railroad',util:'Utility'};
const COL={brown:'#8b5a2b',lblue:'#9bdcf5',pink:'#d9368f',orange:'#f7941d',red:'#e8262b',yellow:'#f5d800',green:'#2e9e4f',dblue:'#1f6fd0',rr:'#1f3b2a',util:'#c4dfc2'};
const D={deal:'Steal a full set',jsn:'Cancel an action',sly:'Steal 1 property',forced:'Swap 1 property',debt:'Collect $5M',bday:'All pay $2M',go:'Draw 2',house:'+$3M rent',hotel:'+$4M rent',dbl:'Double the rent'};
let G,uid=0,busy=0,hres=null,speed=6;const delay=()=>2600-speed*250;
const shuffle=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function deck(){const d=[],mk=o=>d.push({id:++uid,...o});
 [[1,6],[2,5],[3,3],[4,3],[5,2],[10,1]].forEach(([v,n])=>{for(let i=0;i<n;i++)mk({t:'money',v,n:'$'+v+'M'})});
 const P={brown:[1,'Mediterranean Avenue','Baltic Avenue'],lblue:[1,'Oriental Avenue','Vermont Avenue','Connecticut Avenue'],pink:[2,'St. Charles Place','States Avenue','Virginia Avenue'],orange:[2,'St. James Place','Tennessee Avenue','New York Avenue'],red:[3,'Kentucky Avenue','Indiana Avenue','Illinois Avenue'],yellow:[3,'Atlantic Avenue','Ventnor Avenue','Marvin Gardens'],green:[4,'Pacific Avenue','North Carolina Avenue','Pennsylvania Avenue'],dblue:[4,'Park Place','Boardwalk'],rr:[2,'Reading Railroad','Pennsylvania Railroad','B&O Railroad','Short Line'],util:[2,'Electric Company','Water Works']};
 for(const c in P){const[v,...ns]=P[c];ns.forEach(n=>mk({t:'prop',c,v,n}))}
 [['pink','orange',2,2],['red','yellow',3,2],['brown','lblue',1,1],['lblue','rr',4,1],['green','rr',4,1],['dblue','green',4,1],['util','rr',2,1]].forEach(([a,b,v,n])=>{for(let i=0;i<n;i++)mk({t:'wild',cols:[a,b],c:a,v,n:'Wild '+NAME[a]+'/'+NAME[b]})});
 for(let i=0;i<2;i++)mk({t:'wild',cols:Object.keys(CP),c:null,v:0,n:'Wild (any color)'});
 [['brown','lblue'],['pink','orange'],['yellow','red'],['green','dblue'],['rr','util']].forEach(([a,b])=>{for(let i=0;i<2;i++)mk({t:'rent',cols:[a,b],v:1,n:'Rent '+NAME[a]+'/'+NAME[b]})});
 for(let i=0;i<3;i++)mk({t:'rent',cols:Object.keys(CP),v:3,wild:1,n:'Wild Rent'});
 [['deal','Deal Breaker',5,2],['jsn','Just Say No',4,3],['sly','Sly Deal',3,3],['forced','Forced Deal',3,3],['debt','Debt Collector',3,3],['bday',"It's My Birthday",2,3],['go','Pass Go',1,10],['house','House',3,3],['hotel','Hotel',4,2],['dbl','Double the Rent',1,2]]
  .forEach(([a,n,v,k])=>{for(let i=0;i<k;i++)mk({t:'act',a,n,v})});
 return shuffle(d)}

/* ---------- helpers ---------- */
const log=m=>{G.log.push(m);if(!/^— /.test(m))sfx('place')},oth=p=>G.pl.filter(x=>x!==p);
const cnt=(p,c)=>p.props.filter(x=>x.c===c).length;
const full=(p,c)=>{const l=p.props.filter(x=>x.c===c);return l.length>=CP[c]&&l.some(x=>x.t==='prop'||x.cols.length<10)};
const fullSets=p=>Object.keys(CP).filter(c=>full(p,c));
const winner=()=>G.pl.find(p=>fullSets(p).length>=3);
const rentOf=(p,c)=>{const n=Math.min(cnt(p,c),CP[c]);if(!n)return 0;let r=RENT[c][n-1];if(full(p,c)){const b=p.bld[c]||{};if(b.house)r+=3;if(b.hotel)r+=4}return r};
const sc=(p,c)=>cnt(p,c)>=CP[c]?-1:cnt(p,c);
const assets=p=>[...p.bank.map(c=>({c,from:'bank'})),...p.props.map(c=>({c,from:'props'})),...Object.values(p.bld).flatMap(b=>Object.values(b).map(c=>({c,from:'bld'})))];
const tot=p=>assets(p).reduce((s,a)=>s+a.c.v,0);
const hCols=(p,a)=>Object.keys(CP).filter(c=>{const b=p.bld[c]||{};return c!=='rr'&&c!=='util'&&full(p,c)&&(a==='house'?!b.house:b.house&&!b.hotel)});
function draw(p,n){for(let i=0;i<n;i++){if(!G.deck.length){G.deck=shuffle(G.disc);G.disc=[]}if(G.deck.length)p.hand.push(G.deck.pop())}}
function rem(p,a){if(a.from==='bld'){const b=p.bld[a.c.bc];for(const k in b)if(b[k]===a.c)delete b[k]}else{const L=a.from==='bank'?p.bank:p.props;L.splice(L.indexOf(a.c),1)}}
function receive(r,c){if(c.t==='prop'||c.t==='wild'){if(c.t==='wild')c.c=c.cols.slice().sort((x,y)=>sc(r,y)-sc(r,x))[0];r.props.push(c)}else r.bank.push(c)}

/* ---------- prompts ---------- */
const choose=(t,o,cancel=true)=>new Promise(res=>{const m=$('#modal'),b=m.firstChild;b.innerHTML=`<h3>${t}</h3>`;
 const add=(l,v)=>{const e=document.createElement('button');e.textContent=l;e.onclick=()=>{m.style.display='none';res(v)};b.appendChild(e)};
 o.forEach(x=>add(x.label,x.value));if(cancel)add('Cancel',null);m.style.display='flex'});
const decide=(p,t,o,cancel)=>p.human?choose(t,o,cancel):Promise.resolve(o.slice().sort((a,b)=>(b.s||0)-(a.s||0))[0].value);
const note=(p,m)=>p.human?choose(m,[{label:'OK',value:1}],false):0;
const payUI=(A,amt,to)=>new Promise(res=>{const m=$('#modal'),b=m.firstChild,sel=new Set(),ok=document.createElement('button');
 b.innerHTML=`<h3>Pay $${amt}M to ${to.name}</h3><p>No change is given. Select cards:</p>`;
 const upd=()=>{const s=[...sel].reduce((t,i)=>t+A[i].c.v,0);ok.textContent=`Pay ($${s}M selected)`;ok.disabled=s<amt};
 A.forEach((a,i)=>{const e=document.createElement('button');e.textContent=`${a.c.n} — $${a.c.v}M (${a.from==='bank'?'bank':'table'})`;
  e.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);e.style.background=sel.has(i)?'#26a86a':'';upd()};b.appendChild(e)});
 ok.onclick=()=>{m.style.display='none';res([...sel].map(i=>A[i]))};b.appendChild(ok);upd();m.style.display='flex'});

/* ---------- payments & Just Say No ---------- */
function botPay(A,amt){const s=[],pool=A.filter(a=>a.c.v>0);let r=amt;
 while(r>0&&pool.length){const ok=pool.filter(a=>a.c.v>=r).sort((x,y)=>x.c.v-y.c.v||(x.from==='bank'?0:1)-(y.from==='bank'?0:1))[0];
  const a=ok||pool.slice().sort((x,y)=>y.c.v-x.c.v)[0];s.push(a);pool.splice(pool.indexOf(a),1);r-=a.c.v}
 return s}
async function pay(f,t,amt){render();const A=assets(f);if(!A.length){log(`${f.name} has nothing to pay`);return}
 const s=A.reduce((x,a)=>x+a.c.v,0)<=amt?A:f.human?await payUI(A,amt,t):botPay(A,amt);
 for(const a of s){rem(f,a);receive(t,a.c)}log(`${f.name} pays ${t.name}: ${s.map(a=>a.c.n).join(', ')||'nothing'}`)}
async function blocked(att,def,what){let cancel=false;
 for(;;){const j=def.hand.find(c=>c.a==='jsn');
  if(!j||!(def.human?await choose(`${att.name} → ${def.name}: ${what}. Play Just Say No?`,[{label:'Just Say No!',value:1},{label:'Allow it',value:0}],false):1))break;
  def.hand.splice(def.hand.indexOf(j),1);G.disc.push(j);cancel=!cancel;log(`${def.name} plays Just Say No!`);[att,def]=[def,att];render();await sleep(delay()/2)}
 return cancel}

/* ---------- playing cards ---------- */
async function rent(p,k,arg){
 const cs=k.cols.filter(c=>cnt(p,c));
 if(!cs.length){await note(p,'You own no properties in those colors.');return 0}
 const c=arg&&cs.includes(arg)?arg:await decide(p,'Charge rent for…',cs.map(x=>({label:`${NAME[x]} ($${rentOf(p,x)}M)`,value:x,s:rentOf(p,x)})));if(!c)return 0;
 let T=oth(p);
 if(k.wild){const t=await decide(p,'Charge which player?',T.map(o=>({label:o.name,value:o,s:tot(o)})));if(!t)return 0;T=[t]}
 const DR=p.hand.filter(x=>x.a==='dbl'),mx=Math.min(DR.length,G.plays-1);let n=0;
 if(mx){n=await decide(p,'Add Double the Rent?',[...Array(mx+1).keys()].map(i=>({label:i?`Yes — ×${2**i} (uses ${i} extra play${i>1?'s':''})`:'No',value:i,s:i})));if(n===null)return 0}
 p.hand.splice(p.hand.indexOf(k),1);G.disc.push(k);
 for(let i=0;i<n;i++){p.hand.splice(p.hand.indexOf(DR[i]),1);G.disc.push(DR[i])}
 G.plays-=n;const amt=rentOf(p,c)*2**n;log(`${p.name} charges $${amt}M rent (${NAME[c]})`);
 for(const o of T)if(!await blocked(p,o,'Rent $'+amt+'M'))await pay(o,p,amt);
 return 1}

async function play(p,k,how,arg){
 const take=()=>p.hand.splice(p.hand.indexOf(k),1),bin=()=>{take();G.disc.push(k)};
 if(how==='bank'){take();p.bank.push(k);log(`${p.name} banks ${k.n} ($${k.v}M)`);return 1}
 if(how==='prop'){let c=k.c;
  if(k.t==='wild'){c=arg||await decide(p,'Place as…',k.cols.map(x=>({label:NAME[x],value:x,s:sc(p,x)})));if(!c)return 0}
  take();k.c=c;p.props.push(k);log(`${p.name} plays ${k.n} as ${NAME[c]}`);return 1}
 if(k.t==='rent')return rent(p,k,arg);
 const a=k.a,O=oth(p);
 if(a==='go'){bin();draw(p,2);log(`${p.name} plays Pass Go (draws 2)`);return 1}
 if(a==='house'||a==='hotel'){const cs=hCols(p,a);
  if(!cs.length){await note(p,a==='house'?'You need a complete set (not Railroad/Utility) without a House.':'You need a complete set that already has a House and no Hotel.');return 0}
  const c=arg&&cs.includes(arg)?arg:await decide(p,'Build on…',cs.map(x=>({label:NAME[x],value:x,s:rentOf(p,x)})));if(!c)return 0;
  take();k.bc=c;(p.bld[c]=p.bld[c]||{})[a]=k;log(`${p.name} builds a ${k.n} on ${NAME[c]}`);return 1}
 if(a==='bday'){bin();log(`${p.name} plays It's My Birthday`);for(const o of O)if(!await blocked(p,o,"It's My Birthday"))await pay(o,p,2);return 1}
 if(a==='debt'){const t=await decide(p,'Collect $5M from…',O.map(o=>({label:o.name,value:o,s:tot(o)})));if(!t)return 0;
  bin();log(`${p.name} plays Debt Collector on ${t.name}`);if(!await blocked(p,t,'Debt Collector'))await pay(t,p,5);return 1}
 if(a==='sly'||a==='forced'){
  const T=O.flatMap(o=>o.props.filter(c=>!full(o,c.c)).map(c=>({label:`${o.name}: ${c.n} (${NAME[c.c]})`,value:{o,c},ids:[c.id],s:c.v+sc(p,c.c)*3})));
  const M=p.props.filter(c=>!full(p,c.c));
  if(!T.length||(a==='forced'&&!M.length)){await note(p,'No valid targets (cards in complete sets are protected).');return 0}
  const t=await pick(p,a==='sly'?'Sly Deal: click the property to steal':'Forced Deal: click the property to take',T);if(!t)return 0;
  let m;if(a==='forced'){m=await pick(p,'Forced Deal: now click one of YOUR properties to give',M.map(c=>({label:`${c.n} (${NAME[c.c]})`,value:c,ids:[c.id],s:-sc(p,c.c)*3-c.v})));if(!m)return 0}
  bin();log(`${p.name} plays ${k.n} targeting ${t.o.name}'s ${t.c.n}`);
  if(!await blocked(p,t.o,k.n)){t.o.props.splice(t.o.props.indexOf(t.c),1);receive(p,t.c);
   if(m){p.props.splice(p.props.indexOf(m),1);receive(t.o,m)}}
  return 1}
 if(a==='deal'){
  const T=O.flatMap(o=>fullSets(o).map(c=>({label:`${o.name}: ${NAME[c]} set`,value:{o,c},ids:o.props.filter(x=>x.c===c).map(x=>x.id),s:rentOf(o,c)})));
  if(!T.length){await note(p,'Nobody has a complete set.');return 0}
  const t=await pick(p,'Deal Breaker: click the set to steal',T);if(!t)return 0;
  bin();log(`${p.name} plays Deal Breaker on ${t.o.name}'s ${NAME[t.c]} set`);
  if(!await blocked(p,t.o,'Deal Breaker')){const cs=t.o.props.filter(c=>c.c===t.c);t.o.props=t.o.props.filter(c=>c.c!==t.c);p.props.push(...cs);
   if(t.o.bld[t.c]){p.bld[t.c]={...p.bld[t.c],...t.o.bld[t.c]};delete t.o.bld[t.c]}}
  return 1}
 await note(p,a==='jsn'?'Just Say No is played when an action targets you. You can bank it instead.':'Double the Rent must be played with a Rent card.');return 0}

/* ---------- bot ---------- */
async function botPlay(p){const H=p.hand,O=oth(p),f=fn=>H.find(fn);
 const go=async(k,h)=>{const ok=await play(p,k,h);if(ok)G.plays--;return !!ok};let k;
 if(k=f(c=>c.a==='go'))return go(k,'act');
 if(O.some(o=>fullSets(o).length)&&(k=f(c=>c.a==='deal')))return go(k,'act');
 if(k=f(c=>c.t==='prop'||c.t==='wild'))return go(k,'prop');
 if(k=f(c=>(c.a==='house'||c.a==='hotel')&&hCols(p,c.a).length))return go(k,'act');
 if(k=f(c=>c.t==='rent'&&Math.max(0,...c.cols.filter(x=>cnt(p,x)).map(x=>rentOf(p,x)))>=2))return go(k,'act');
 if(O.some(o=>o.props.some(c=>!full(o,c.c)))&&(k=f(c=>c.a==='sly')))return go(k,'act');
 if(O.some(o=>tot(o)>=4)&&(k=f(c=>c.a==='debt')))return go(k,'act');
 if(k=f(c=>c.a==='bday'))return go(k,'act');
 if(k=f(c=>c.t==='money'))return go(k,'bank');
 if(H.length>7&&(k=H.filter(c=>c.t!=='prop'&&c.t!=='wild'&&c.a!=='jsn').sort((a,b)=>a.v-b.v)[0]))return go(k,'bank');
 return false}

/* ---------- game loop ---------- */
const waitHuman=()=>new Promise(r=>{hres=v=>{hres=null;SEL=null;r(v)};render()});
const val=c=>c.a==='jsn'?9:c.v;
async function run(){
 while(!G.over){const p=G.pl[G.cur];G.plays=3;draw(p,p.hand.length?2:5);log(`— ${p.name}'s turn —`);render();
  while(G.plays>0){let r;if(p.human)r=await waitHuman();else{await sleep(Math.max(delay(),animUntil-Date.now()));r=await botPlay(p)}
   render();if(winner()||r==='end'||r===false)break}
  await sleep(Math.max(0,animUntil-Date.now()));const w=winner();if(w){G.over=w;render();return}
  while(p.hand.length>7){const k=p.human?await choose(`Discard down to 7 (${p.hand.length} in hand)`,p.hand.map(c=>({label:`${c.n} ($${c.v}M)`,value:c})),false):p.hand.slice().sort((a,b)=>val(a)-val(b))[0];
   p.hand.splice(p.hand.indexOf(k),1);G.disc.push(k);log(`${p.name} discards ${k.n}`)}
  G.cur=(G.cur+1)%G.pl.length}}

/* ---------- UI ---------- */

const DARK=new Set(['brown','rr','dblue']),F='#2d2a26';
const GRAD={1:['#fde7a8','#fdcf90'],2:['#ffb89d','#fe9d82'],3:['#ccd9c6','#aebca7'],4:['#aed3e8','#8fb7ce'],5:['#a091c6','#7e6fa3']};
const TINT={1:'#fde9b0',2:'#fbc0ac',3:'#cad8c4',4:'#a9d0e6',5:'#9d8cc3'};
const MC={1:'#efe6b4',2:'#f1c7b3',3:'#d3e1bd',4:'#b4d2e4',5:'#bb9fd2',10:'#f2b53c'};
const TL={deal:'Deal|Breaker',jsn:'Just|Say No!',sly:'Sly|Deal',forced:'Forced|Deal',debt:'Debt|Collector',bday:"It's My|Birthday!",go:'Pass|Go',house:'House',hotel:'Hotel',dbl:'Double|The Rent'};
const DESC={rent:'All players pay you rent for properties you own in one of these colors',wr:'Force any player to pay you rent for any property you own',deal:'Steal a complete set of properties from any player (includes any buildings)',jsn:'Used any time when an action card is played against you',sly:'Steal a property from a player of your choice (cannot be part of a full set)',forced:'Swap any property with another player (cannot be part of a full set)',debt:'Force any player to pay you 5M',bday:'All players give you 2M as a “gift”',go:'Draw 2 extra cards',house:'Add onto any full set you own to add 3M to the rent value (except railroads and utilities)',hotel:'Add onto any full set you own to add 4M to the rent value (except railroads and utilities)',dbl:'Needs to be played with a rent card to double it'};
const ICON={
 dbl:`<text x="50" y="84" font-size="30" font-weight="900" text-anchor="middle" fill="${F}">x2</text>`,
 go:`<rect x="34" y="58" width="16" height="24" rx="2" fill="${F}" transform="rotate(-12 42 70)"/><rect x="48" y="54" width="16" height="24" rx="2" fill="${F}" transform="rotate(14 56 66)"/>`,

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g);g.connect(AU.mg);o.start(t);o.stop(t+3.3)})}
function musicTick(){if(!AU.mg||!AU.on.music)return;const c=AU.ctx;
 while(AU.nextChord<c.currentTime+3){const ch=CH[AU.ci++%CH.length],t=AU.nextChord,dur=8;ch.forEach(m=>pad(t,m,dur));
  for(let bt=t+1+Math.random()*1.5;bt<t+dur-.5;bt+=1.6+Math.random()*2.4)bell(bt,ch[Math.random()*ch.length|0]+(Math.random()<.5?24:36));

function musicStart(){if(AU.mg||!auInit())return;const c=AU.ctx;AU.mg=c.createGain();AU.mg.gain.setValueAtTime(0,c.currentTime);AU.mg.gain.linearRampToValueAtTime(.55,c.currentTime+3);

function musicStop(){clearInterval(AU.timer);const g=AU.mg;AU.mg=null;if(g){g.gain.cancelScheduledValues(0);g.gain.setTargetAtTime(0,AU.ctx.currentTime,.15);setTimeout(()=>g.disconnect(),1500)}}
function sfx(kind){if(!AU.on.sfx||!AU.ctx||AU.ctx.state!=='running')return;const c=AU.ctx,t=c.currentTime,nz=(f,type,q)=>{const n=c.createBufferSource(),b=c.createBiquadFilter();n.buffer=AU.noise;b.type=type;b.frequency.value=f;if(q)b.Q.value=q;n.connect(b);return[n,b]};
 if(kind==='place'){const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(640,t);o.frequency.exponentialRampToValueAtTime(260,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+.14);
  const[n,b]=nz(1800,'highpass'),ng=c.createGain();ng.gain.setValueAtTime(.12,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.05);b.connect(ng);ng.connect(AU.out);n.start(t);n.stop(t+.06)}
 else if(kind==='move'){const[n,b]=nz(500,'bandpass',1.2),g=c.createGain();n.loop=true;b.frequency.setValueAtTime(500,t);b.frequency.exponentialRampToValueAtTime(2200,t+.6);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+.25);g.gain.linearRampToValueAtTime(.0001,t+.7);b.connect(g);g.connect(AU.out);n.start(t);n.stop(t+.75)}}

const TTL='<h1 class="ttl" style="margin:0"><span class="t1">MONOPOLY</span><span class="t2">DEAL</span></h1>';
const BACK=to=>`<button class="bkb" onclick="go('${to}')">◀ Back</button>`;
function rulesHtml(){
 const rent=Object.keys(CP).map(c=>`<tr><td><span class="sw" style="background:${COL[c]}"></span>${NAME[c]}</td><td>${CP[c]}</td>${[0,1,2,3].map(i=>`<td>${RENT[c][i]!=null?'$'+RENT[c][i]+'M':'–'}</td>`).join('')}</tr>`).join('');
 return `<h2>Goal</h2><p>Be the first player to have <b>3 complete property sets of 3 different colors</b> on the table. You can play with 2 to 5 players (you versus 1–4 computer opponents).</p>
<h2>Your Turn</h2><ol><li><b>Draw</b> 2 cards from the deck. If your hand is empty, draw 5 instead.</li><li><b>Play up to 3 cards</b> from your hand. You may play fewer, or none.</li><li><b>Discard</b> down to 7 cards if you hold more when you finish. Then the next player goes.</li></ol>
<h2>How To Play A Card Here</h2><ul><li><b>Drag and drop.</b> Press and hold a card in your hand, drag it, and let go over where you want it. Places it can go glow gold while you drag.</li><li>Money goes on your <b>Bank</b>. Properties go on your <b>Properties</b>. Action cards go in the <b>Action zone</b>, or on your Bank if you want to keep them as money.</li><li>Rent, House and Hotel: drop the card on the <b>set</b> you want to charge rent on or build on. Wild property cards: drop on a matching set or on one of the color chips that appear.</li><li>Click a wild card already on the table (on your turn) to move it to its other color for free.</li><li>Sly Deal, Forced Deal and Deal Breaker ask you to click the card or set on the board, then press Confirm.</li><li>Press <b>End turn</b> when you are done early. Pressing Esc cancels a drag.</li></ul>
<h2>Winning</h2><p>The moment you have 3 full sets of different colors (a set that uses wild cards counts), you win, even if it happens on someone else's turn.</p>
<h2>The Deck (106 Cards)</h2><table><tr><th>Type</th><th>Cards</th></tr><tr><td>Money</td><td>20</td></tr><tr><td>Property</td><td>28</td></tr><tr><td>Property wild</td><td>11</td></tr><tr><td>Rent</td><td>13</td></tr><tr><td>Action</td><td>34</td></tr></table>
<h2>Money</h2><p>$1M ×6, $2M ×5, $3M ×3, $4M ×3, $5M ×2, $10M ×1. Money goes in your bank. Any action or rent card can also be banked as money, but once banked it can never be used for its action. <b>Property cards can never be banked.</b></p>
<h2>Properties And Rent</h2><p>Collect cards of one color to make a set. The more cards you own in a color, the more rent it earns. A full set earns the most.</p>
<table><tr><th>Color</th><th>Set size</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>${rent}</table>
<h2>Property Wild Cards (11)</h2><p>Two-color wilds count as either color shown: Pink/Orange ×2, Red/Yellow ×2, Brown/Light Blue, Light Blue/Railroad, Green/Railroad, Dark Blue/Green, Utility/Railroad. The <b>2 rainbow wilds</b> count as any color but are worth $0. Wild cards cannot be banked.</p>
<h2>Rent Cards (13)</h2><ul><li><b>Two-color rent</b> (10 cards, $1M): pick one of its two colors that you own. <b>Every other player</b> pays you that color's rent.</li><li><b>Wild rent</b> (3 cards, $3M): pick any color you own. <b>One player</b> of your choice pays you.</li><li>Rent depends on how many cards you own in that color, plus $3M for a House and $4M for a Hotel on a full set.</li></ul>
<h2>Action Cards (34)</h2><ul>
<li><b>Pass Go</b> ×10 ($1M): draw 2 extra cards.</li>
<li><b>Deal Breaker</b> ×2 ($5M): steal a complete set from any player, including its House and Hotel.</li>
<li><b>Sly Deal</b> ×3 ($3M): steal one property from any player. It cannot be part of a complete set.</li>
<li><b>Forced Deal</b> ×3 ($3M): swap one of your properties for one of another player's. Neither can be in a complete set.</li>
<li><b>Debt Collector</b> ×3 ($3M): one player pays you $5M.</li>
<li><b>It's My Birthday</b> ×3 ($2M): every other player pays you $2M.</li>
<li><b>Double The Rent</b> ×2 ($1M): play with a rent card to double it. It uses one extra play. Two of them make the rent ×4.</li>
<li><b>House</b> ×3 ($3M): add to a complete set (not Railroad or Utility) to raise its rent by $3M. One per set.</li>
<li><b>Hotel</b> ×2 ($4M): add to a complete set that already has a House, to raise its rent by $4M more. One per set.</li>
<li><b>Just Say No</b> ×3 ($4M): cancel an action played against you. See below.</li></ul>
<h2>Paying</h2><ul><li>You pay from your <b>bank and your properties</b> (including Houses and Hotels). Never from your hand.</li><li><b>No change is given.</b> If you overpay, you lose the difference.</li><li>If you cannot cover the full amount, you give everything you have. If you have nothing on the table, you pay nothing.</li><li>Properties you pay with go to the other player's properties. Money and action cards go to their bank. Paying with a card from a complete set breaks that set.</li></ul>
<h2>Just Say No</h2><p>Play it at any time, even on another player's turn, when an action targets you: Deal Breaker, Sly Deal, Forced Deal, Debt Collector, It's My Birthday or any rent. It cancels the action for you only. The attacker can answer with their own Just Say No, and you can answer that, back and forth. The last card played decides the result. Playing one does not use up a play.</p>
<h2>Good To Know</h2><ul><li>If the deck runs out, the discard pile is shuffled to make a new one.</li><li>Your opponents' hands are hidden, but you can see their banked money and all their properties.</li><li>You only get 3 plays, so choose between building, attacking and banking money for rent.</li><li><b>This version:</b> only one House and one Hotel per color, and a set made only of rainbow wilds does not count as complete.</li></ul>`}
